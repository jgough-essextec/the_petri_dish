# Global configuration
global:
  namespace: todo-app
  domain: todo.apps.goughlab.goughlab.com

# Backend configuration
backend:
  name: todo-backend
  image:
    repository: jonathandgough/petri-dish-backend
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  
  deployment:
    replicas: 1
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  
  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 45
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Environment variables
  env:
    - name: DATABASE_PATH
      value: "/app/data/todos.db"

  # Persistent volume for SQLite database
  persistence:
    enabled: true
    storageClass: ""  # Use default storage class
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: "/app/data"

# Frontend configuration
frontend:
  name: todo-frontend
  image:
    repository: jonathandgough/petri-dish-frontend
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  
  deployment:
    replicas: 1
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  
  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 45
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Environment variables
  env:
    - name: REACT_APP_API_URL
      value: "https://todo-api.apps.goughlab.goughlab.com"

# OpenShift Routes
routes:
  frontend:
    enabled: true
    host: todo.apps.goughlab.goughlab.com
    tls:
      termination: edge
      
  backend:
    enabled: true
    host: todo-api.apps.goughlab.goughlab.com
    tls:
      termination: edge

# Security Context
# Security Context - OpenShift compatible
securityContext:
  runAsNonRoot: true
  # Let OpenShift assign user ID from allowed range
  # runAsUser and runAsGroup will be set by SCC

# Pod Security Context - OpenShift compatible
podSecurityContext:
  # Let OpenShift SCC handle fsGroup assignment
  # fsGroup will be set automatically
