apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: todo-app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/jgough-essextec/the_petri_dish.git
    targetRevision: open-shift-build
    path: k8s/helm-chart
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: global.domain
          value: "todo.apps.goughlab.goughlab.com"
        - name: routes.frontend.host
          value: "todo.apps.goughlab.goughlab.com"
        - name: routes.backend.host
          value: "todo-api.apps.goughlab.goughlab.com"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: todo-app
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: route.openshift.io
      kind: Route
      jsonPointers:
        - /status
